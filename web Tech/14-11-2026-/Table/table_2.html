<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Two Tables Side by Side</title>

    <style>
        .container {
            display: flex;
            justify-content: space-between;
            gap: 20px;
        }

        table {
            border-collapse: collapse;
            width: 50%;
        }

        table,
        td {
            border: 1px solid black;
        }

        td {
            padding: 10px;
            text-align: center;
        }
    </style>

</head>

<body>

    <div class="container">

        <!-- First Table -->
        <table>
            <!--1_row-->
            <tr>
                <td colspan="4">1</td>

            </tr>
            <!--2_row-->
            <tr>
                <td rowspan="2">1</td>
                <td>2</td>
                <td>3</td>
                <td rowspan="2">4</td>
            </tr>
            <!--3_row-->
            <tr>

                <td>2</td>
                <td>3</td>

            </tr>
            <!--4_row-->
            <tr>
                <td colspan="4">1</td>

            </tr>
            <!--5_row-->
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>

        <!-- Second Table -->
        <table>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
            <tr>
                <td>1</td>
                <td>2</td>
                <td>3</td>
                <td>4</td>
            </tr>
        </table>

    </div>

</body>

</html>
