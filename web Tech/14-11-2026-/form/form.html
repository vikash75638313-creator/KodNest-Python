<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Registration Form</title>
</head>

<body>

    <!-- Navigation -->

    <h1 id="home">Student Registration Form</h1>

    <nav>
        <a href="#home">Home</a> |
        <a href="#registration">Registration</a> |
        <a href="#captcha">Captcha</a> |
        <a href="#contact">Contact</a>
    </nav>

    <hr>

    <!-- Registration Form -->

    <h2 id="registration">Registration Details</h2>

    <form action="#" method="post">

        <!-- Text Input -->

        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Enter your name" minlength="3" maxlength="30" required>

        <br><br>

        <!-- Email Input -->

        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required>

        <br><br>

        <!-- Password Input -->

        <label for="password">Password:</label>
        <input type="password" id="password" name="password" minlength="8" required>

        <br><br>

        <!-- Number Input -->

        <label for="age">Age:</label>
        <input type="number" id="age" name="age" min="18" max="60" required>

        <br><br>

        <!-- Telephone Input -->

        <label for="phone">Mobile Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{10}" placeholder="Enter 10 digit number" required>

        <br><br>

        <!-- Date Input -->

        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob">

        <br><br>

        <!-- Time Input -->

        <label for="time">Preferred Time:</label>
        <input type="time" id="time" name="time">

        <br><br>

        <!-- URL Input -->

        <label for="website">Website:</label>
        <input type="url" id="website" name="website" placeholder="https://example.com">

        <br><br>

        <!-- Search Input -->

        <label for="search">Search Course:</label>
        <input type="search" id="search" name="search">

        <br><br>

        <!-- File Input -->

        <label for="resume">Upload Resume:</label>
        <input type="file" id="resume" name="resume" accept=".pdf,.doc,.docx">

        <br><br>

        <!-- Color Input -->

        <label for="color">Choose Color:</label>
        <input type="color" id="color" name="color">

        <br><br>

        <!-- Range Input -->

        <label for="range">Experience Level:</label>
        <input type="range" id="range" name="range" min="0" max="10">

        <br><br>

        <!-- Radio Buttons -->

        <label>Gender:</label>

        <input type="radio" id="male" name="gender" value="Male" required>
        <label for="male">Male</label>

        <input type="radio" id="female" name="gender" value="Female">
        <label for="female">Female</label>

        <input type="radio" id="other" name="gender" value="Other">
        <label for="other">Other</label>

        <br><br>

        <!-- Checkboxes -->

        <label>Select Skills:</label>

        <input type="checkbox" id="html" name="skills" value="HTML">
        <label for="html">HTML</label>

        <input type="checkbox" id="css" name="skills" value="CSS">
        <label for="css">CSS</label>

        <input type="checkbox" id="js" name="skills" value="JavaScript">
        <label for="js">JavaScript</label>

        <input type="checkbox" id="python" name="skills" value="Python">
        <label for="python">Python</label>

        <br><br>

        <!-- Dropdown -->

        <label for="course">Select Course:</label>

        <select id="course" name="course" required>

            <option value="">-- Select Course --</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="JavaScript">JavaScript</option>
            <option value="Python">Python</option>

        </select>

        <br><br>

        <!-- Textarea -->

        <label for="address">Address:</label>

        <br>

        <textarea id="address" name="address" rows="4" cols="40" placeholder="Enter your address"
            maxlength="200"></textarea>

        <br><br>

        <!-- CAPTCHA -->

        <h3 id="captcha">Captcha Verification</h3>

        <p><strong>A7K9P2</strong></p>

        <label for="captchaInput">Enter Captcha:</label>

        <input type="text" id="captchaInput" name="captcha" placeholder="Enter captcha here" pattern="A7K9P2"
            title="Enter A7K9P2 exactly" required>

        <br><br>

        <!-- Hidden Input -->

        <input type="hidden" name="formType" value="StudentRegistration">

        <!-- Submit Button -->

        <input type="submit" value="Submit Form">

        <!-- Reset Button -->

        <input type="reset" value="Reset Form">

    </form>

    <hr>

    <!-- Contact Section -->

    <h2 id="contact">Contact Us</h2>

    <p>Email: example@gmail.com</p>

    <a href="#home">Back to Top</a>

</body>

</html>
